name: DEPLOY
on:
  workflow_dispatch:
    inputs:
      CLUSTER:
        description: "Cluster Name"
        required: true
        default: osac
      KUBECONFIG:
        description: 'KUBECONFIG'
      PULL_SECRET:
        description: 'Pull Secret'
        required: false
        default: /root/openshift_pull.json
      DEPLOY_CLUSTER:
        description: "Deploy cluster"
        required: true
        default: true
        type: boolean
      DEPLOY_OSAC:
        description: "Deploy OSAC"
        required: true
        default: true
        type: boolean
      RUN_TESTS:
        description: "Run tests"
        required: true
        default: true
        type: boolean
      CLUSTER_TEMPLATE:
        description: "ClusterCatalogItem template (ocp-ci-small, ocp-4-20-ai-maas)"
        required: false
        default: ocp-ci-small
      USE_CUSTOM_IMAGE:
        description: "Use custom AAP EE image (quay.io/karmab/osac-aap:latest)"
        required: false
        default: false
        type: boolean

env:
 HOME: /root
 PYTHONUNBUFFERED: true
 CLUSTER: ${{github.event.inputs.CLUSTER}}
 KUBECONFIG: ${{github.event.inputs.KUBECONFIG}}
 PULL_SECRET: ${{github.event.inputs.PULL_SECRET}}
 CLUSTER_TEMPLATE: ${{github.event.inputs.CLUSTER_TEMPLATE || 'ocp-ci-small'}}
 USE_CUSTOM_IMAGE: ${{github.event.inputs.USE_CUSTOM_IMAGE || 'false'}}

jobs:
  deploy-cluster:
    if: ${{ inputs.DEPLOY_CLUSTER }}
    runs-on: hypervisor
    steps:
    - uses: actions/checkout@v2
    - run: git pull origin ${GITHUB_REF##*/}
    - run: kcli delete cluster -y osac
    - run: kcli delete plan -y smoke-worker
    - run: kcli delete network -y osacnet || true
    - run: kcli create network -c 192.168.253.0/24 -P dhcp_start=192.168.253.2 -P dhcp_end=192.168.253.230 osacnet
    - run: kcli create dns -n osacnet -d karmalabs.corp -i 192.168.253.254 -a api-int.osac.karmalabs.corp api.osac
    - run: kcli create dns -n osacnet -d karmalabs.corp -i 192.168.253.254 -a '*' apps.osac
    - run: kcli create vm -c 2 -P start=false -P numcpus=32 -P memory=98304 -P disks=[100,100] -P nets='[{"name":"osacnet","mac":"aa:bb:cc:dd:ee:01"}]' smoke-worker
    - run: kcli create cluster openshift --pf osac.yml -P pull_secret=$PULL_SECRET $CLUSTER

  deploy-osac:
    needs: deploy-cluster
    if: ${{ always() && inputs.DEPLOY_OSAC && !failure() }}
    runs-on: hypervisor
    steps:
    - uses: actions/checkout@v2
    - run: git pull origin ${GITHUB_REF##*/}
    - run: KUBECONFIG=${KUBECONFIG:-/root/.kcli/clusters/$CLUSTER/auth/kubeconfig} CLUSTER_TEMPLATE=$CLUSTER_TEMPLATE USE_CUSTOM_IMAGE=$USE_CUSTOM_IMAGE bash deploy-osac.sh

  run-tests:
    if: ${{ always() && inputs.RUN_TESTS && !failure() }}
    needs: deploy-osac
    runs-on: hypervisor
    steps:
    - uses: actions/checkout@v2
    - run: git pull origin ${GITHUB_REF##*/}
    - run: KUBECONFIG=${KUBECONFIG:-/root/.kcli/clusters/$CLUSTER/auth/kubeconfig} CLUSTER_TEMPLATE=$CLUSTER_TEMPLATE bash tests.sh
